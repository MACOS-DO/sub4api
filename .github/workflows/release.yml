name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.7)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/main-release.yml
    with:
      release-ref: ${{ inputs.tag || github.ref }}
    secrets: inherit
